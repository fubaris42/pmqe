[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmqe"
version = "1.0.0"
description = "PDF & Image Multi-Query Extractor with OCR, manual review, and bookmarked PDF merge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.5.0",
    "pymupdf>=1.24.0",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt.windows.foundation; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography; sys_platform == 'win32'",
    "ocrmac>=1.0.0; sys_platform == 'darwin'",
    "rapidocr-onnxruntime>=1.3.0",
    "numpy",
    "pillow",
    "pyahocorasick>=2.0.0",
    "pillow-heif",
]

[project.scripts]
pmqe = "pmqe.gui:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines in SQL/UI strings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
