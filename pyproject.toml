[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pmqe"
dynamic = ["version"]
description = "Find pages matching many queries across folders of PDFs and images, with OCR, manual review and a bookmarked PDF merge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "fubaris42" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "PySide6>=6.5.0",
    "pymupdf>=1.24.0",
    "winrt-Windows.Media.Ocr; sys_platform == 'win32'",
    "winrt.windows.foundation; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging; sys_platform == 'win32'",
    "winrt-Windows.Security.Cryptography; sys_platform == 'win32'",
    "ocrmac>=1.0.0; sys_platform == 'darwin'",
    "rapidocr-onnxruntime>=1.3.0",
    "numpy",
    "pillow",
    "pyahocorasick>=2.0.0",
    "pillow-heif",
]

[project.urls]
Homepage = "https://github.com/fubaris42/pmqe"
Issues = "https://github.com/fubaris42/pmqe/issues"

[project.scripts]
pmqe = "pmqe.__main__:main"

[tool.hatch.version]
path = "pmqe/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/screenshots", "/.github"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.8",
]
build = [
    "pyinstaller>=6.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long SQL / UI strings read better unwrapped
    "RUF001",  # deliberate Unicode in strings (ligatures, dashes)
    "RUF002",
    "RUF003",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 120  # a hung test prints every thread's stack
markers = [
    "ocr: runs the platform's real OCR engine",
]

[tool.uv]
# Fail at lock time if a package has no wheel for a platform and Python version
# that CI tests (onnxruntime 1.24, for example, dropped Python 3.10), and make
# uv pick versions that do.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.10'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.10'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.10'",
    "sys_platform == 'win32' and platform_machine == 'AMD64' and python_version == '3.13'",
    "sys_platform == 'darwin' and platform_machine == 'arm64' and python_version == '3.13'",
    "sys_platform == 'linux' and platform_machine == 'x86_64' and python_version == '3.13'",
]
