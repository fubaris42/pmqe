name: Build macOS (Apple Silicon)

# Produces the M1+ (arm64) .app bundle. Runs on tag pushes and on demand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # GitHub-hosted Apple Silicon (arm64) runner
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Build .app bundle
        run: uv run --with pyinstaller pyinstaller pmqe.spec --noconfirm

      - name: Verify the bundle launches
        run: |
          # Boot the app headlessly for a few seconds; fail if it exits early.
          QT_QPA_PLATFORM=offscreen ./dist/pmqe.app/Contents/MacOS/pmqe &
          pid=$!
          sleep 8
          if kill -0 "$pid" 2>/dev/null; then
            echo "OK: pmqe.app launched (pid $pid)"
            kill "$pid"
          else
            wait "$pid"; echo "App exited early with code $?"; exit 1
          fi

      - name: Zip the bundle (ditto preserves symlinks + permissions)
        run: ditto -c -k --keepParent dist/pmqe.app pmqe-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pmqe-macos-arm64
          path: pmqe-macos-arm64.zip
          if-no-files-found: error
